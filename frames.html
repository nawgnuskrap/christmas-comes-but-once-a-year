<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CHRISTMAS COMES BUT ONCE A YEAR</title>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: 'Courier New', Courier, monospace; padding: 50px; margin: 0; }
        h1 { font-size: 14px; font-weight: normal; margin: 0 0 50px 0; text-transform: uppercase; }
        #index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 15px 10px; font-size: 14px; }
        .frame-number { color: #000; text-decoration: none; cursor: pointer; }
        .frame-number:hover { font-weight: bold; }
    </style>
</head>
<body>
    <h1>INDEX</h1>
    <div id="index-grid"></div>
    <script>
        const grid = document.getElementById('index-grid');
        for (let i = 1; i <= 11920; i++) {
            const a = document.createElement('a');
            a.className = 'frame-number';
            a.innerText = String(i).padStart(5, '0');
            a.href = `frame_detail.html?id=${i}`;
            grid.appendChild(a);
        }
    </script>
</body>
</html>
