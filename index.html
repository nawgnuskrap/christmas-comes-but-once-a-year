<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CHRISTMAS COMES BUT ONCE A YEAR</title>
    <style>
        body { background-color: #ffffff; color: #000000; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #content-wrapper { width: 90%; max-width: 1000px; display: flex; flex-direction: column; align-items: flex-start; }
        #main-frame { width: 100%; height: auto; display: block; margin: 0 auto; }
        #info-container { margin-top: 5vh; width: 100%; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="content-wrapper">
        <img id="main-frame" src="" alt="Loading...">
        <div id="info-container">
            <!-- INDEX 버튼 영역을 삭제하고 정보 레이아웃만 유지합니다 -->
            <div style="display: flex; flex-direction: column; align-items: flex-start;">
                <div id="frame-index"></div>
                <div id="active-duration"></div>
            </div>
        </div>
    </div>
    <script>
        const TOTAL_FRAMES = 11920;
        function update() {
            const now = new Date();
            const startYear = (now.getMonth() === 11 && now.getDate() >= 26) ? now.getFullYear() : now.getFullYear() - 1;
            const localStart = new Date(startYear, 11, 26, 0, 0, 0);
            const localEnd = new Date(startYear + 1, 11, 26, 0, 0, 0);
            const actualYearSec = (localEnd - localStart) / 1000;
            const SEC_PER_FRAME = actualYearSec / TOTAL_FRAMES;
            const elapsed = (now.getTime() - localStart.getTime()) / 1000;
            const frameIdx = Math.floor((elapsed % actualYearSec) / SEC_PER_FRAME) + 1;

            const imgNum = String(frameIdx).padStart(5, '0');
            document.getElementById('main-frame').src = `web_frames/${imgNum}.jpg`;

            // Frame No. 09765 of 11920 형식 유지
            document.getElementById('frame-index').innerText = `Frame No. ${imgNum} of 11920`;

            const fStart = new Date(localStart.getTime() + (frameIdx - 1) * SEC_PER_FRAME * 1000);
            const fEnd = new Date(localStart.getTime() + frameIdx * SEC_PER_FRAME * 1000);
            const dateStr = fStart.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
            document.getElementById('active-duration').innerText = `Active Duration : ${fStart.toLocaleTimeString('en-GB', {hour12:false})} – ${fEnd.toLocaleTimeString('en-GB', {hour12:false})}, ${dateStr}`;
        }
        update(); setInterval(update, 10000);
    </script>
</body>
</html>
